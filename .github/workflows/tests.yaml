name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install requirements
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest -q tests
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --strict custom_components/local_ocr
